name: Build and Push Docker Image

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Keep in sync with the dockerfile's N8N_VERSION ARG default. Pinned per
  # n8n's own official guidance (n8n-io/n8n-hosting README: "Pin a specific
  # image tag for production rather than relying on `stable`/`latest`").
  #
  # docker.io (not docker.n8n.io): confirmed identical digest for this pinned
  # tag on both registries (same image, mirrored) -- docker.n8n.io was
  # persistently rate-limiting CI builds (429) while Docker Hub wasn't. NOTE:
  # this equivalence only holds for the pinned version tag -- Docker Hub's
  # `:latest` is a different, non-Alpine image, confirmed separately.
  BASE_IMAGE: docker.io/n8nio/n8n:2.37.10

jobs:
  resolve-base:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.base.outputs.image }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # BASE_IMAGE is pinned to a specific release, not `:latest` -- its digest
      # never changes until this file's BASE_IMAGE (and the dockerfile's
      # N8N_VERSION) are deliberately bumped together. So the cache key has no
      # time component: this resolves once, ever, per pinned version, instead
      # of re-hitting the registry's manifest endpoint on every build. Bumping
      # BASE_IMAGE naturally busts it (new key = cache miss).
      - name: Cache resolved base image digest (for this pinned version)
        id: cache-digest
        uses: actions/cache@v4
        with:
          path: /tmp/base-image-ref.txt
          key: n8n-base-image-digest-${{ env.BASE_IMAGE }}

      - name: Resolve base image digest
        if: steps.cache-digest.outputs.cache-hit != 'true'
        run: |
          digest=$(docker buildx imagetools inspect "${{ env.BASE_IMAGE }}" | awk '/^Digest:/{print $2; exit}')
          echo "${{ env.BASE_IMAGE }}" | sed -E "s#:[^:@]+\$#@${digest}#" > /tmp/base-image-ref.txt
          cat /tmp/base-image-ref.txt

      - name: Read resolved base image ref
        id: base
        run: echo "image=$(cat /tmp/base-image-ref.txt)" >> "$GITHUB_OUTPUT"

  # Builds each platform on its OWN native runner instead of QEMU-emulating
  # arm64 on an amd64 host. QEMU user-mode emulation of native Node addons
  # (this image's dependency tree includes isolated-vm, which JIT-compiles at
  # install time) reliably crashed with "Illegal instruction" under emulation
  # -- native arm64 runners avoid that class of failure entirely, not just
  # work around it.
  #
  # For push events (real publishes), each platform's image is pushed by
  # digest only (no tags yet); the `merge` job below combines both digests
  # into a single multi-arch manifest under the real tags. For pull_request
  # events, this just validates the Dockerfile builds on both native
  # architectures -- no push, no digest export, no merge needed.
  build:
    needs: resolve-base
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (PR validation only, no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          build-args: |
            BASE_IMAGE=${{ needs.resolve-base.outputs.image }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Build and push by digest
        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            BASE_IMAGE=${{ needs.resolve-base.outputs.image }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Sanitize platform name for artifact
        if: github.event_name != 'pull_request'
        id: platform-slug
        run: echo "slug=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ steps.platform-slug.outputs.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combines the per-platform digests from `build` into a single multi-arch
  # manifest under the real tags (docker/metadata-action computes those here,
  # not in `build`, since `build` only ever pushes anonymous per-digest images).
  merge:
    needs: [resolve-base, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix={{branch}}-,suffix=-{{date 'YYYYMMDDHHmmss'}}
            type=schedule,pattern=weekly-{{date 'YYYYMMDD'}}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

      - name: Generate image summary
        run: |
          echo "### Docker Image Published! 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** ${{ env.REGISTRY }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Platforms:** linux/amd64, linux/arm64 (built natively, no QEMU)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To pull this image:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  test-image:
    needs: merge
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]

    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.platform }}

      - name: Test Docker image
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            n8n --version

      - name: Report test results
        run: |
          echo "✅ Image test successful for platform: ${{ matrix.platform }}" >> $GITHUB_STEP_SUMMARY

name: Build and Push Docker Image

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Keep in sync with the dockerfile's N8N_VERSION ARG default. Pinned per
  # n8n's own official guidance (n8n-io/n8n-hosting README: "Pin a specific
  # image tag for production rather than relying on `stable`/`latest`") --
  # NOTE: docker.io/n8nio/n8n is NOT a substitute for docker.n8n.io/n8nio/n8n,
  # confirmed to be a different (non-Alpine) image entirely.
  BASE_IMAGE: docker.n8n.io/n8nio/n8n:2.0.3

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # BASE_IMAGE is pinned to a specific release, not `:latest` -- its digest
      # never changes until this file's BASE_IMAGE (and the dockerfile's
      # N8N_VERSION) are deliberately bumped together. So the cache key has no
      # time component: this resolves once, ever, per pinned version, instead
      # of re-hitting docker.n8n.io's rate-limited manifest endpoint on every
      # build. Bumping BASE_IMAGE naturally busts it (new key = cache miss).
      - name: Cache resolved base image digest (for this pinned version)
        id: cache-digest
        uses: actions/cache@v4
        with:
          path: /tmp/base-image-ref.txt
          key: n8n-base-image-digest-${{ env.BASE_IMAGE }}

      - name: Resolve base image digest
        if: steps.cache-digest.outputs.cache-hit != 'true'
        run: |
          digest=$(docker buildx imagetools inspect "${{ env.BASE_IMAGE }}" | awk '/^Digest:/{print $2; exit}')
          echo "${{ env.BASE_IMAGE }}" | sed -E "s#:[^:@]+\$#@${digest}#" > /tmp/base-image-ref.txt
          cat /tmp/base-image-ref.txt

      - name: Read resolved base image ref
        id: base
        run: echo "image=$(cat /tmp/base-image-ref.txt)" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix={{branch}}-,suffix=-{{date 'YYYYMMDDHHmmss'}},enable=${{ github.event_name != 'pull_request' }}
            type=schedule,pattern=weekly-{{date 'YYYYMMDD'}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate image summary
        if: github.event_name != 'pull_request'
        run: |
          echo "### Docker Image Published! 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** ${{ env.REGISTRY }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Platforms:** linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To pull this image:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  test-image:
    needs: build-and-push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]

    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.platform }}

      - name: Test Docker image
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            n8n --version

      - name: Report test results
        run: |
          echo "✅ Image test successful for platform: ${{ matrix.platform }}" >> $GITHUB_STEP_SUMMARY
